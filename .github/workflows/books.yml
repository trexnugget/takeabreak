name: Book catalog

# Builds the TakeABreak library from Project Gutenberg's catalog data every Monday, and on demand.
# Output: books/v2/ with LibriVox audiobooks (app 4.27+) and books/v1/ ebooks only (app 4.26),
# served by GitHub Pages at https://trexnugget.github.io/takeabreak/books/v2/.
on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: books
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Build the catalog
        run: |
          python catalog/build_catalog.py books/v2
          python catalog/build_catalog.py books/v1 --no-audio
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/v1 books/v2
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Book catalog: weekly update"
          git push
