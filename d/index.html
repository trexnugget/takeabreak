<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You've been challenged</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0D0C0E;color:#F6F1EA;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:360px;padding:32px 24px;text-align:center}
h1{font-size:24px;margin:0 0 10px}
p{color:#C9C2C8;line-height:1.5;margin:0 0 24px}
a.btn{display:block;padding:16px;border-radius:999px;font-weight:700;text-decoration:none;margin-top:10px}
.gold{background:#F2C14E;color:#2B2008}.dark{background:rgba(255,255,255,.08);color:#F6F1EA}
</style>
</head>
<body>
<main>
<h1>You've been challenged</h1>
<p>A screen-time duel on TakeABreak: less screen time wins. Open it in the app to accept.</p>
<a class="btn gold" id="open" href="#">Open in TakeABreak</a>
<a class="btn dark" href="https://play.google.com/store/apps/details?id=com.takeabreak.app">Get TakeABreak on Google Play</a>
</main>
<script>
// 25 Nov 2026: opens the app on the d (takeabreak://d/<id>); without the app, Google Play.
var id = new URLSearchParams(location.search).get("id") || "";
if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) id = "";
var link = "intent://d/" + id + "#Intent;scheme=takeabreak;package=com.takeabreak.app;S.browser_fallback_url=" +
  encodeURIComponent("https://play.google.com/store/apps/details?id=com.takeabreak.app") + ";end";
document.getElementById("open").href = id ? link : "https://play.google.com/store/apps/details?id=com.takeabreak.app";
if (id && /Android/i.test(navigator.userAgent)) location.href = link;
</script>
</body>
</html>
